[theme]
# "Amber" design: light theme, neutral greys, amber accent (#CC6600) for widgets.
base = "light"
primaryColor = "#CC6600"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
